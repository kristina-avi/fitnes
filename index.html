<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Регистрация клиента фитнес-клуба</h2>
    <form id="registerForm">
        <input type="email" placeholder="Email" id="regEmail" required>
        <input type="tel" placeholder="+7 " id="registerPhone" required>
        <div id="phoneError" style="color:red;"></div>
        <input type="password" placeholder="Пароль" id="regPassword" required>
        <div id="regError" style="color:red;"></div>
        <button type="submit">Зарегистрироваться</button>
    </form>

    <h2>Авторизация клиента фитнес-клуба</h2>
    <form id="loginForm">
        <input type="email" placeholder="Email" id="loginEmail" required>
        <input type="password" placeholder="Пароль" id="loginPassword" required>
        <div id="loginError" style="color:red;"></div>
        <button type="submit">Авторизация</button>
    </form>

    <h2>Записать клиента фитнес-клуба</h2>
    <form id="memberForm">
        <input type="text" placeholder="Введите имя" id="name" required>
        <input type="text" placeholder="Тренер" id="trainer">
        <div id="memberError" style="color:red;"></div>
        <button type="submit">Записаться</button>
    </form>

    <div>
        <button id="loadMembersBtn">Загрузить клиентов</button>
        <button id="logoutBtn">Выйти</button>
    </div>

    <div id="membersError" style="color:red;"></div>
    <pre id="output" style="display:none; background:#f4f4f4; padding:10px;"></pre>

    <script type="module" src="api.js"></script>
</body>
</html>
